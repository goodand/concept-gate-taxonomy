[pytest]
# vendored subtree(scior 등)는 이 repo의 테스트 대상이 아니다.
# scior tests는 scior 패키지 설치를 전제하므로 수집에서 제외한다.
# experiments/는 여기서 제외하고 scripts/run_gates.py가 실험별로 별도
# 프로세스에서 돌린다. 실험 폴더들은 동결 규율상 _cert_core.py(6개
# 바이트동일)·evaluate.py(10개)·_gen_prompts.py(7개)를 같은 모듈명으로
# 중복 보유하는데, 한 인터프리터에 모아 돌리면 먼저 로드된 쪽이
# sys.modules를 선점해 다른 실험이 남의 evaluator로 조용히 실행된다.
# 프로세스 분리가 유일하게 확장 가능한 해법이다(러너 헤더 주석 참조).
# `.claude` — Claude Code 가 `.claude/worktrees/<name>/` 아래 **다른 브랜치의
# 체크아웃**을 만든다. pytest 가 거기까지 걸어 들어가면 그 브랜치의 테스트를
# 이 브랜치의 suite 로 수집하고, 양쪽이 같은 이름의 `conceptgate` 패키지를
# import 하므로 **먼저 로드된 쪽이 sys.modules 를 선점한다** — 그러면 이쪽
# 테스트가 저쪽 코드를 검사한다.
#
# 실측(2026-08-25, trunk worktree): 수집 250개 중 **119개가 다른 브랜치 것**
# 이었고, 방금 넣은 수리의 테스트 11건이 수리 없는 사본으로 돌아 실패했다.
# 단독 실행하면 48 passed, 전체 수집이면 11 failed — 같은 테스트다.
#
# `experiments` 를 제외하는 이유와 **같은 충돌**이다(CLAUDE.md "왜 단일
# 스크립트인가": 먼저 로드된 쪽이 sys.modules 를 선점해 다른 실험이 남의
# evaluator 로 조용히 실행된다). 목록에 한 줄이 빠져 있었을 뿐이다.
#
# `.gitignore` 로는 풀리지 않는다 — git 은 등록된 worktree 를 이미 무시한다
# (`git ls-files .claude/worktrees` 0건). 못 보는 것은 pytest 뿐이다.
norecursedirs = vendor .git __pycache__ experiments .claude
asyncio_mode = auto
# 러너를 우회해 pytest experiments/를 직접 돌리는 경우에도 최소한 수집은
# 되도록 유지한다(동명 test_protocol.py 3개). 런타임 충돌까지 막지는 못한다.
addopts = --import-mode=importlib
