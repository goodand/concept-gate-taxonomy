[pytest]
# vendored subtree(scior 등)는 이 repo의 테스트 대상이 아니다.
# scior tests는 scior 패키지 설치를 전제하므로 수집에서 제외한다.
# experiments/는 여기서 제외하고 scripts/run_gates.py가 실험별로 별도
# 프로세스에서 돌린다. 실험 폴더들은 동결 규율상 _cert_core.py(6개
# 바이트동일)·evaluate.py(10개)·_gen_prompts.py(7개)를 같은 모듈명으로
# 중복 보유하는데, 한 인터프리터에 모아 돌리면 먼저 로드된 쪽이
# sys.modules를 선점해 다른 실험이 남의 evaluator로 조용히 실행된다.
# 프로세스 분리가 유일하게 확장 가능한 해법이다(러너 헤더 주석 참조).
norecursedirs = vendor .git __pycache__ experiments
asyncio_mode = auto
# 러너를 우회해 pytest experiments/를 직접 돌리는 경우에도 최소한 수집은
# 되도록 유지한다(동명 test_protocol.py 3개). 런타임 충돌까지 막지는 못한다.
addopts = --import-mode=importlib
