[pytest]
# vendored subtree(scior 등)는 이 repo의 테스트 대상이 아니다.
# scior tests는 scior 패키지 설치를 전제하므로 수집에서 제외한다.
norecursedirs = vendor .git __pycache__
asyncio_mode = auto
# experiments/ 여러 폴더가 test_protocol.py라는 같은 basename을 쓰기 때문에
# 기본 prepend import mode에서는 루트 수집이 collection error로 중단됐다
# (실험 폴더로 cd해야만 테스트가 돌았다 = 루트 게이트가 사실상 무효).
# importlib mode는 동명 test 모듈을 공존시킨다.
addopts = --import-mode=importlib
